[project]
name = "correspondence-register-backend"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pdf2image>=1.17",
    "pytesseract>=0.3.13",
    "google-genai>=2.20",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
